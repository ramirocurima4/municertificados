name: Build Windows Installer (MuniCertificados)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-windows:
    name: Compilar .exe e Instalador (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Ejecutar suite de pruebas automatizadas (unittest)
        run: |
          python -m unittest discover -s tests -v

      - name: Compilar aplicación con PyInstaller (MuniCertificados.spec)
        run: |
          pyinstaller --clean --noconfirm MuniCertificados.spec

      - name: Instalar Inno Setup 6 y compilar Setup_MuniCertificados_v1.0.exe
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir Instalador Oficial (Setup_MuniCertificados_v1.0.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Windows-Setup_MuniCertificados_v1.0
          path: dist_installer/Setup_MuniCertificados_v1.0.exe
          if-no-files-found: error

      - name: Subir Versión Portable (Carpeta MuniCertificados)
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Windows-MuniCertificados
          path: dist/MuniCertificados/
          if-no-files-found: error
